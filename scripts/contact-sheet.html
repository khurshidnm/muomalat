<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Muomalat illustrations</title>
<style>
  :root { --paper: #FAF8F3; --ink: #10201D; --line: #E4DCC8; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #fff; color: var(--ink); font: 13px/1.3 ui-monospace, Menlo, monospace; }
  h1 { font: 600 18px/1 system-ui, sans-serif; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .grid.sq { grid-template-columns: repeat(8, 1fr); margin-top: 20px; }
  figure { margin: 0; }
  img { display: block; width: 100%; height: auto; border: 1px solid var(--line); background: var(--paper); }
  figcaption { padding-top: 4px; }
</style>
</head>
<body>
<h1>Muomalat — editorial illustration set (public/images)</h1>
<div class="grid" id="wide"></div>
<div class="grid sq" id="sq"></div>
<script>
  const wide = ['city-skyline', 'city-street', 'facade-lattice', 'bank-hall', 'glass-tower', 'chart-line', 'chart-bars', 'chart-candles', 'meeting-table', 'signing', 'workshop', 'agri-field', 'containers', 'construction', 'vehicles', 'globe', 'gulf-skyline', 'financial-district', 'club-hall', 'panel']
  const sq = Array.from({ length: 8 }, (_, i) => 'portrait-0' + (i + 1))
  const card = (n) => `<figure><img src="../public/images/${n}.svg" alt="${n}"><figcaption>${n}.svg</figcaption></figure>`
  document.getElementById('wide').innerHTML = wide.map(card).join('')
  document.getElementById('sq').innerHTML = sq.map(card).join('')
</script>
</body>
</html>
